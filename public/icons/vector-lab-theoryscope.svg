<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Theoryscope</title>
  <!-- Point cloud of theoretical texts -->
  <g fill="#b8941e" opacity="0.7">
    <circle cx="14" cy="20" r="1.4"/>
    <circle cx="20" cy="28" r="1.4"/>
    <circle cx="26" cy="17" r="1.4"/>
    <circle cx="34" cy="24" r="1.4"/>
    <circle cx="42" cy="18" r="1.4"/>
    <circle cx="48" cy="26" r="1.4"/>
    <circle cx="16" cy="40" r="1.4"/>
    <circle cx="24" cy="46" r="1.4"/>
    <circle cx="34" cy="42" r="1.4"/>
    <circle cx="42" cy="48" r="1.4"/>
    <circle cx="50" cy="44" r="1.4"/>
    <circle cx="20" cy="52" r="1.4"/>
  </g>
  <!-- Two principal eigenvector axes through the centroid -->
  <g stroke="#b8941e" stroke-width="1.2" stroke-linecap="round" opacity="0.95">
    <line x1="8" y1="26" x2="56" y2="42"/>
    <line x1="22" y1="56" x2="44" y2="10"/>
  </g>
  <!-- Centroid mark -->
  <circle cx="32" cy="33" r="2.2" fill="#b8941e"/>
</svg>
